server.port=${PORT:8080}
spring.application.name=microservices-logging-proxy

# Comma separated list of allowed origins for the frontend ("*" allows all)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Probability (0..1) that a PaymentService call fails on purpose
app.payment.failure-rate=${PAYMENT_FAILURE_RATE:0.1}

# Maximum number of log entries kept in memory
app.logs.capacity=${LOGS_CAPACITY:5000}
